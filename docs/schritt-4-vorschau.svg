<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <rect width="800" height="500" fill="#f4f5f9"/>
  <rect x="30" y="20" width="430" height="120" rx="12" fill="#ffffff" stroke="#3b4a8c" stroke-width="3"/>
  <rect x="30" y="20" width="8" height="120" fill="#3b6ea5"/>
  <text x="60" y="52" font-size="18" font-weight="700" fill="#1c1c1e">📖 Strophe 1</text>
  <rect x="50" y="66" width="390" height="56" rx="8" fill="#ffffff" stroke="#c9cede" stroke-width="2"/>
  <text x="62" y="88" font-size="15" fill="#1c1c1e">Näher, mein Gott, zu dir,</text>
  <text x="62" y="108" font-size="15" fill="#1c1c1e">näher zu dir!</text>
  <rect x="30" y="156" width="430" height="120" rx="12" fill="#ffffff" stroke="#dfe1ea"/>
  <rect x="30" y="156" width="8" height="120" fill="#c0392b"/>
  <text x="60" y="188" font-size="18" font-weight="700" fill="#1c1c1e">🔁 Refrain</text>
  <rect x="50" y="202" width="390" height="56" rx="8" fill="#ffffff" stroke="#c9cede" stroke-width="2"/>
  <text x="62" y="224" font-size="15" fill="#1c1c1e">Und wenn auch die Welt vergeht …</text>

  <text x="640" y="34" text-anchor="middle" font-size="17" font-weight="700" fill="#3b4a8c">Vorschau</text>
  <rect x="545" y="48" width="190" height="253" rx="10" fill="#16224d"/>
  <text x="640" y="150" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Näher, mein Gott,</text>
  <text x="640" y="178" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">zu dir,</text>
  <text x="640" y="206" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">näher zu dir!</text>
  <rect x="520" y="322" width="80" height="38" rx="8" fill="#ffffff" stroke="#3b4a8c" stroke-width="2"/>
  <text x="560" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#3b4a8c">← Zurück</text>
  <text x="640" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1c1e">Teil 1 von 2</text>
  <rect x="680" y="322" width="80" height="38" rx="8" fill="#ffffff" stroke="#3b4a8c" stroke-width="2"/>
  <text x="720" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#3b4a8c">Weiter →</text>
  <text x="640" y="400" text-anchor="middle" font-size="14" fill="#555">Die Folie im Hochformat – so sieht sie die Gemeinde später.</text>
</svg>
