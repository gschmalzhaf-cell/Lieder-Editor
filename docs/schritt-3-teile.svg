<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, sans-serif">
  <rect width="800" height="500" fill="#f4f5f9"/>
  <rect x="30" y="20" width="200" height="52" rx="10" fill="#3b4a8c"/>
  <text x="130" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Strophe hinzufügen</text>
  <rect x="245" y="20" width="200" height="52" rx="10" fill="#3b4a8c"/>
  <text x="345" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Refrain hinzufügen</text>
  <rect x="460" y="20" width="200" height="52" rx="10" fill="#ffffff" stroke="#3b4a8c" stroke-width="2"/>
  <text x="560" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#3b4a8c">Weiteres Teil ▾</text>

  <rect x="30" y="92" width="560" height="170" rx="12" fill="#ffffff" stroke="#dfe1ea"/>
  <rect x="30" y="92" width="8" height="170" fill="#3b6ea5"/>
  <rect x="50" y="106" width="44" height="36" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="72" y="131" text-anchor="middle" font-size="18" fill="#555">⠿</text>
  <text x="104" y="130" font-size="20">📖</text>
  <text x="140" y="130" font-size="18" font-weight="700" fill="#1c1c1e">Strophe 1 ✏️</text>
  <rect x="50" y="152" width="520" height="60" rx="8" fill="#ffffff" stroke="#c9cede" stroke-width="2"/>
  <text x="62" y="176" font-size="15" fill="#1c1c1e">Näher, mein Gott, zu dir,</text>
  <text x="62" y="198" font-size="15" fill="#1c1c1e">näher zu dir!</text>
  <rect x="50" y="222" width="110" height="30" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="105" y="242" text-anchor="middle" font-size="12" fill="#1c1c1e">Teil wiederholen</text>
  <rect x="170" y="222" width="90" height="30" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="215" y="242" text-anchor="middle" font-size="12" fill="#1c1c1e">Löschen</text>

  <rect x="30" y="278" width="560" height="170" rx="12" fill="#ffffff" stroke="#dfe1ea"/>
  <rect x="30" y="278" width="8" height="170" fill="#c0392b"/>
  <rect x="50" y="292" width="44" height="36" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="72" y="317" text-anchor="middle" font-size="18" fill="#555">⠿</text>
  <text x="104" y="316" font-size="20">🔁</text>
  <text x="140" y="316" font-size="18" font-weight="700" fill="#1c1c1e">Refrain ✏️</text>
  <rect x="50" y="338" width="520" height="60" rx="8" fill="#ffffff" stroke="#c9cede" stroke-width="2"/>
  <text x="62" y="362" font-size="15" fill="#1c1c1e">Und wenn auch die Welt vergeht,</text>
  <text x="62" y="384" font-size="15" fill="#1c1c1e">so bleibt dein Wort bestehen.</text>
  <rect x="50" y="408" width="110" height="30" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="105" y="428" text-anchor="middle" font-size="12" fill="#1c1c1e">Teil wiederholen</text>
  <rect x="170" y="408" width="90" height="30" rx="8" fill="#f0f1f6" stroke="#c9cede" stroke-width="2"/>
  <text x="215" y="428" text-anchor="middle" font-size="12" fill="#1c1c1e">Löschen</text>
</svg>
